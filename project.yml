name: CalculadoraXTool
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
targets:
  CalculadoraXTool:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/CalculadoraXTool
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Calculadora
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.paulocesar.calculadoraxtool
        PRODUCT_NAME: Calculadora
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
